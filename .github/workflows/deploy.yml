name: Build and Publish
# NEUTRALIZED — hanzoai/status migrated to Hanzo's native deploy pipeline.
# The ONE canonical build/deploy is .hanzo/workflows/deploy.yml, which runs
# in-cluster: Hanzo Git push → act_runner → BuildKit builds the Dockerfile →
# ghcr.io/hanzoai/status:<sha> → kubectl patch app (status, status-lux) →
# operator reconcile → hanzocd. GitHub is a downstream mirror; this workflow no
# longer builds or publishes the image.
on:
  workflow_dispatch:
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Sync notice
        run: echo "native pipeline is .hanzo/workflows/deploy.yml; GitHub is a mirror"
