web:
  port: 8080

storage:
  type: sqlite
  path: /data/status.db

ui:
  title: "Hanzo Status"
  description: "Real-time health of the Hanzo cloud — every product served by the one unified cloud binary at api.hanzo.ai"
  header: "Status"
  logo: "/brands/hanzo/logo.svg"
  link: "https://hanzo.ai"
  dark-mode: true
  favicon:
    default: "/brands/hanzo/favicon.svg"
    size16x16: "/brands/hanzo/favicon-16.png"
    size32x32: "/brands/hanzo/favicon-32.png"
  buttons:
    - name: "Docs"
      link: "https://docs.hanzo.ai"
    - name: "Console"
      link: "https://console.hanzo.ai"
    - name: "HIPs"
      link: "https://github.com/hanzoai/HIPs"
    - name: "GitHub"
      link: "https://github.com/hanzoai"

# ─────────────────────────────────────────────────────────────────────────────
# Live runtime authority is universe/infra/k8s/status/configmap-hanzo.yaml (the
# status-config ConfigMap); hanzoai/status/config/hanzo.yaml mirrors it.
#
# EXHAUSTIVE probe set — one truthful health probe per cloud subsystem.
#
#   The unified cloud binary serves the whole /v1 surface at api.hanzo.ai and
#   returns a clean 404 (text/plain) for any unmounted /v1 route — there is NO
#   SPA catch-all on /v1. So each subsystem is probed at its OWN JSON health
#   route /v1/<product>/health: 200 = UP, 404 = not mounted = DOWN, 5xx/timeout
#   = DOWN. This avoids the SPA false-up entirely (bare api.hanzo.ai/health
#   returns the 200 HTML SPA shell — a false-up — so the core probe uses
#   /v1/health, which is JSON served only when the binary is live).
#
#   UP    = 200 on a JSON route; or an auth gate (401/403) on a gated route;
#           a redirect (3xx) on a host that redirects anon traffic.
#   DOWN  = 404 (route not mounted) · 502/503/504 (binary unreachable) · timeout.
#
#   Datastore primitives (sql/kv/vector/docdb/datastore) are tenancy-scoped: a
#   request with no org context returns 403 "X-Org-Id required" = reachable/UP;
#   a real outage is 5xx/timeout. (The former 500 mis-code is fixed — probes are
#   tightened to any(200,401,403), so a genuine 500 now reads as DOWN.)
#
#   Web properties are SPAs served at the edge; a 200 on the shell is the only
#   meaningful liveness signal for a static site, so they stay host-level 200.
#   The unified binary's own /v1 subsystems are NEVER probed at a web host.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Alerting — transitions page a channel. Provider webhooks come from env
# (os.ExpandEnv), sourced from KMS via a KMSSecret CRD -> status Deployment env.
# An UNSET webhook is validated-invalid and silently ignored (no crash), so this
# block is safe to ship before the secret is wired. Slack = all endpoints;
# PagerDuty = the page-worthy core (api, engine, models, iam, kms, gateway, paas).
# OWNER: create the KMS secret + KMSSecret CRD and inject ALERT_SLACK_WEBHOOK_URL
# (+ ALERT_PAGERDUTY_ROUTING_KEY) into the status Deployment to activate.
# ─────────────────────────────────────────────────────────────────────────────
alerting:
  slack:
    webhook-url: "${ALERT_SLACK_WEBHOOK_URL}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
  pagerduty:
    integration-key: "${ALERT_PAGERDUTY_ROUTING_KEY}"
    default-alert:
      failure-threshold: 5
      success-threshold: 2
      send-on-resolved: true

endpoints:

  # ═══ Core API ═══
  - name: "api.hanzo.ai"
    group: "Core API"
    url: "https://api.hanzo.ai/v1/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts: [{type: slack}, {type: pagerduty}]
  - name: "Models & Inference"
    group: "Core API"
