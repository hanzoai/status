web:
  port: 8080

storage:
  type: sqlite
  path: /data/status.db

ui:
  title: "Zoo Status"
  description: "Real-time research infrastructure health"
  header: "Status"
  logo: "/brands/zoo/logo.svg"
  link: "https://zoo.network"
  dark-mode: true
  favicon:
    default: "/brands/zoo/favicon.svg"
    size16x16: "/brands/zoo/favicon-16.png"
    size32x32: "/brands/zoo/favicon-32.png"
  buttons:
    - name: "ZIPs"
      link: "https://zips.zoo.ngo"
    - name: "GitHub"
      link: "https://github.com/zoolabs"
    - name: "Support"
      link: "https://zoo.network/support"

endpoints:

  # ═══════════════════════════════════════════════
  # MAINNET
  # ═══════════════════════════════════════════════

  - name: "Explorer"
    group: "Mainnet"
    url: "https://explore-zoo.lux.network"
    interval: 60s
    conditions:
      - "[STATUS] == any(200, 302)"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 720h"

  - name: "RPC (Zoo Chain)"
    group: "Mainnet"
    url: "https://api.lux.network/mainnet/v1/bc/2Y625Kvdd4wZ5LKx9kLSf1jGALyARmXVN1YsTb4F3Hzv4bPDbp/rpc"
    method: POST
    body: '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
    headers:
      Content-Type: application/json
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
      - "[BODY].result != null"

  # ═══════════════════════════════════════════════
  # SERVICES
  # ═══════════════════════════════════════════════

  - name: "Exchange"
    group: "Services"
    url: "https://lux.exchange"
    interval: 60s
    conditions:
      - "[STATUS] == any(200, 302)"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 720h"

  - name: "Bridge"
    group: "Services"
    url: "https://bridge.lux.network"
    interval: 60s
    conditions:
      - "[STATUS] == any(200, 302)"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 720h"

  # ═══════════════════════════════════════════════
  # CLOUD
  # ═══════════════════════════════════════════════

  - name: "Cloud"
    group: "Cloud"
    url: "https://cloud.zoo.network"
    interval: 60s
    conditions:
      - "[STATUS] == any(200, 302)"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 720h"

  - name: "Cloud API"
    group: "Cloud"
    url: "https://api.cloud.zoo.network/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
      - "[CERTIFICATE_EXPIRATION] > 720h"

  - name: "Cloud WebSocket"
    group: "Cloud"
    url: "wss://ws.cloud.zoo.network"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"

  # ═══════════════════════════════════════════════
  # WEB
  # ═══════════════════════════════════════════════

  - name: "zoo.network"
    group: "Web"
    url: "https://zoo.network"
    interval: 60s
    conditions:
      - "[STATUS] == any(200, 302)"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 720h"

  - name: "zoo.ngo"
    group: "Web"
    url: "https://zoo.ngo"
    interval: 60s
    conditions:
      - "[STATUS] == any(200, 302)"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 720h"

  - name: "ZIPs"
    group: "Web"
    url: "https://zips.zoo.ngo"
    interval: 60s
    conditions:
      - "[STATUS] == any(200, 302)"
      - "[RESPONSE_TIME] < 3000"
      - "[CERTIFICATE_EXPIRATION] > 720h"
